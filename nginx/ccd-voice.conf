# =============================================================================
# CCD Voice Automation - Nginx reverse proxy
# Install: copy to /etc/nginx/conf.d/ccd-voice.conf (included inside http {}),
#          set server_name + certificate paths, then `nginx -t && nginx -s reload`.
# Twilio requires a publicly reachable HTTPS URL; set BASE_URL in .env to the
# https:// origin served here so TwiML action URLs and signature checks match.
# =============================================================================

upstream ccd_voice_backend {
    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Webhook burst protection (Twilio retries quickly on failure).
limit_req_zone $binary_remote_addr zone=ccd_voice_webhooks:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ccd_voice_api:10m rate=20r/s;

# --- HTTP: ACME challenge + redirect to HTTPS --------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name voice.ccd-delivery.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS --------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name voice.ccd-delivery.com;

    ssl_certificate     /etc/letsencrypt/live/voice.ccd-delivery.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voice.ccd-delivery.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:CCDSSL:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/ccd-voice.access.log;
    error_log  /var/log/nginx/ccd-voice.error.log warn;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 1m;
    client_body_buffer_size 64k;

    # Shared proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    proxy_buffering         on;
    proxy_buffer_size       16k;
    proxy_buffers           8 16k;
    proxy_busy_buffers_size 32k;

    # NOTE: no proxy_set_header / add_header inside locations below, so the
    # server-level headers above are inherited everywhere.

    # Twilio voice webhooks: small TwiML payloads, must answer fast.
    location /api/telephony/ {
        limit_req zone=ccd_voice_webhooks burst=60 nodelay;
        proxy_pass http://ccd_voice_backend;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # Workflow REST API (AutomationEdge Process Studio)
    location /api/workflow/ {
        limit_req zone=ccd_voice_api burst=40 nodelay;
        proxy_pass http://ccd_voice_backend;
    }

    # Live dashboard updates (Server-Sent Events): never buffer, allow long-lived connections.
    location = /api/dashboard/stream {
        proxy_pass http://ccd_voice_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://ccd_voice_backend;
    }

    location = /health {
        access_log off;
        proxy_pass http://ccd_voice_backend;
    }

    # Simulator dashboard + static assets
    location / {
        proxy_pass http://ccd_voice_backend;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 512;
}
